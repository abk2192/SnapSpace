<!DOCTYPE html>
<html lang="en" data-theme="light" data-color="blue">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SnapSpace</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2563eb" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="appbar">
    <div class="appbar-inner">
      <button class="btn secondary icon-only" id="mainMenuBtn" title="Menu" style="margin-right: 8px;"><span class="material-symbols-outlined">menu</span></button>
      <div class="title">
        <div class="badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M9 15l2 2 4-4"></path>
          </svg>
        </div>
        SnapSpace
        <div style="width: 2px; height: 18px; background: var(--outline-2); margin: 0 8px; border-radius: 2px;"></div>
        <input type="text" id="workspaceTitleInput" placeholder="Project Name" title="Rename Project" style="border: none; background: transparent; font-weight: 600; font-size: 15px; color: var(--muted); outline: none; flex: 1; min-width: 100px; font-family: inherit;" />
      </div>
      <div class="actions">
        <div id="searchWrap" class="search-wrap">
            <input type="text" id="searchInput" class="input" placeholder="Search Projects..." title="Shortcut: Ctrl+Shift+F" style="padding-left: 32px; height: 36px; border-radius: 18px;" autocomplete="off" />
            <span class="material-symbols-outlined" style="position: absolute; left: 10px; top: 10px; font-size: 16px; color: var(--muted); pointer-events: none;">search</span>
            <div id="searchDropdown" class="search-dropdown"></div>
        </div>
        <span id="saveIndicator" style="font-size: 12px; color: var(--primary); font-weight: 700; margin-right: 8px; opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; gap: 4px; pointer-events: none;"><span class="material-symbols-outlined" style="font-size: 16px;">cloud_done</span> Saved</span>
        <button class="btn secondary" id="renameTabBtn"><span class="material-symbols-outlined">edit</span> Rename Tab</button>
        <button class="btn secondary" id="importBtn"><span class="material-symbols-outlined">upload</span> Import</button>
        <input type="file" id="importInput" accept=".html" hidden />
        <button class="btn danger" id="resetBtn" title="Clear all tabs and items"><span class="material-symbols-outlined">delete_sweep</span> Reset</button>
        <button class="btn" id="addScenarioBtn"><span class="material-symbols-outlined">add</span> Add Item</button>
        <button class="btn" id="exportHtmlBtn"><span class="material-symbols-outlined">download</span> Export Project</button>
      </div>
    </div>
  </header>

  <script src="app.js"></script>
  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered.', reg))
          .catch(err => console.error('Service Worker failed.', err));
      });
    }
  </script>
</body>
</html>
